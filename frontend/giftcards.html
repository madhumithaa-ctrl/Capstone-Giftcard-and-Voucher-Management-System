<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gift Cards</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Gift Cards</h1>

            <p>Select your preferred gift card</p>

            <div class="gift-card">

                <h2>Shopping Gift Card</h2>

                <p>Value: ₹500</p>

                <p>Use for shopping purchases</p>

                <button onclick="selectGiftCard('Shopping Gift Card')">
                    Select
                </button>

            </div>

            <br>

            <div class="gift-card">

                <h2>Food Gift Card</h2>

                <p>Value: ₹300</p>

                <p>Use for food purchases</p>

                <button onclick="selectGiftCard('Food Gift Card')">
                    Select
                </button>

            </div>

            <br>

            <div class="gift-card">

                <h2>Entertainment Gift Card</h2>

                <p>Value: ₹500</p>

                <p>Use for entertainment</p>

                <button onclick="selectGiftCard('Entertainment Gift Card')">
                    Select
                </button>

            </div>

            <br>

            <button onclick="window.location.href='home.html'">
                Back to Home
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
