<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email OTP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Verify Your Email</h1>
            <p>Enter the OTP sent to your email.</p>

            <form id="otpForm">
                <label>Email OTP</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" inputmode="numeric" pattern="[0-9]{6}"
                    maxlength="6" required>

                <button type="submit">Verify OTP</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("otpForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = sessionStorage.getItem("pendingEmail");
            const otp = document.getElementById("otp").value;

            if (!email) {
                alert("Please register again.");
                window.location.href = "register.html";
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/verify-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, otp })
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || "OTP verification failed");
                    return;
                }

                sessionStorage.removeItem("pendingEmail");
                alert("Email verified! Registration successful.");
                window.location.href = "login.html";

            } catch (error) {
                alert("Backend connection failed. Check the server.");
            }
        });
    </script>
</body>

</html>
