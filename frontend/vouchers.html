<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vouchers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Vouchers</h1>

            <p>Select your preferred voucher</p>

            <div class="gift-card">

                <h2>Shopping Voucher</h2>

                <p>Discount: 20%</p>

                <p>For shopping purchases</p>

                <button onclick="selectVoucher('Shopping Voucher')">
                    Select
                </button>

            </div>

            <br>

            <div class="gift-card">

                <h2>Food Voucher</h2>

                <p>Discount: 15%</p>

                <p>For food purchases</p>

                <button onclick="selectVoucher('Food Voucher')">
                    Select
                </button>

            </div>

            <br>

            <div class="gift-card">

                <h2>Entertainment Voucher</h2>

                <p>Discount: 10%</p>

                <p>For entertainment</p>

                <button onclick="selectVoucher('Entertainment Voucher')">
                    Select
                </button>

            </div>

            <br>

            <button onclick="window.location.href='home.html'">
                Back to Home
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
